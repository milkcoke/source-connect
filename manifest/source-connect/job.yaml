apiVersion: batch/v1
kind: Job
metadata:
  name: source-connect
  namespace: app
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: source-connect
          image: ghcr.io/milkcoke/sourceconnect/source-connector:latest
          env:
            - name: JOB_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: SPRING_CONFIG_LOCATION
              value: "file:/config/application.yaml" # Overwrite only application.yaml path
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret_access_key
          imagePullPolicy: Always
          resources:
            requests:
              memory: 1Gi
              cpu: 1000m
            limits:
              memory: 1Gi
              cpu: 1000m
          volumeMounts:
            - name: config
              mountPath: /config # default path for application.yaml
      volumes:
        - name: config
          configMap:
            name: source-connect-config
