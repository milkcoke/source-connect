apiVersion: apps/v1
kind: Deployment
metadata:
  name: offset-manager
  namespace: app
spec:
  selector:
    matchLabels:
      app: offset-manager
  replicas: 1
  template:
    metadata:
      labels:
        app: offset-manager
    spec:
      containers:
        - name: offset-manager
          image: ghcr.io/milkcoke/sourceconnect/offset-manager:latest
          env:
            - name: SPRING_CONFIG_LOCATION
              value: "file:/config/application.yaml" # Overwrite only application.yaml path
          imagePullPolicy: Always
          resources:
            requests:
              memory: 1Gi
              cpu: 1000m
            limits:
              memory: 1Gi
              cpu: 1000m
          volumeMounts:
            - name: config
              mountPath: /config # default path for application.yaml
      volumes:
        - name: config
          configMap:
            name: offset-manager-config
