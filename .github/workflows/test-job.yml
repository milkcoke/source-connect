name: Reusable Test Job
on:
  workflow_call:
    inputs:
      module:
        description: The Gradle module to test (e.g. source-connector)
        required: true
        type: string
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:25-jdk-alpine
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run tests for ${{ inputs.module }}
        run: ./gradlew :${{ inputs.module }}:test
