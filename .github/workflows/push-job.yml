name: Reusable Push Image
on:
  workflow_call:
    inputs:
      module:
        description: 'The Gradle module name to build (e.g. source-connector)'
        required: true
        type: string
      image_tag:
        description: The tag to apply to the container image
        required: true
        type: string

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup JDK 25
        uses: actions/setup-java@v5.1.0
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: 'gradle'
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build and Push Image with Jib
        run: |
          ./gradlew :${{ inputs.module }}:jib \
          -Djib.from.image=eclipse-temurin:25-jre-alpine \
          -Djib.to.tags=${{ inputs.image_tag }},latest \
          -Djib.to.image=ghcr.io/${{ github.repository_owner }}/sourceconnect/${{ inputs.module }}
